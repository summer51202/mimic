name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  naming:
    name: Active Mimic naming
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Test naming guard
        run: node --test scripts/verify-mimic-naming.test.mjs
      - name: Enforce active naming
        run: node scripts/verify-mimic-naming.mjs

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_ACCESS_SECRET: mimic-ci-access-secret
      JWT_REFRESH_SECRET: mimic-ci-refresh-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --runInBand
      - name: HTTP E2E
        run: npm run test:e2e -- --runInBand

  web:
    name: Web PWA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      MIMIC_API_BASE_URL: http://localhost:3000/api/v1
      MIMIC_COOKIE_SECURE: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test parsed CI workflow contract
        run: node --test ../scripts/verify-ci-workflow.test.mjs
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  containers:
    name: Production containers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify production image contracts
        run: node --test scripts/verify-production-images.test.mjs
      - name: Verify backup behavior contracts on Linux
        run: node --test ops/backup/backup-contract.test.mjs
      - name: Build API image
        run: docker build -f backend/Dockerfile backend -t mimic-api:ci
      - name: Build Web image without upload credentials
        run: >-
          docker build
          --build-arg MIMIC_API_BASE_URL=http://127.0.0.1:3000/api/v1
          -f web/Dockerfile web -t mimic-web:ci
      - name: Build backup image
        run: docker build -f ops/backup/Dockerfile ops/backup -t mimic-backup:ci
      - name: Check backup image POSIX shell syntax
        run: |
          docker run --rm --entrypoint /bin/sh mimic-backup:ci -n /opt/mimic/backup.sh
          docker run --rm --entrypoint /bin/sh mimic-backup:ci -n /opt/mimic/restore-drill.sh
          docker run --rm --entrypoint /bin/sh mimic-backup:ci -n /opt/mimic/restore-entrypoint.sh
      - name: Smoke-check production image runtimes
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' mimic-api:ci)" = "node"
          test "$(docker image inspect --format '{{json .Config.Cmd}}' mimic-api:ci)" = '["node","dist/src/main.js"]'
          docker run --rm --entrypoint node mimic-api:ci --version
          test "$(docker image inspect --format '{{.Config.User}}' mimic-web:ci)" = "node"
          test "$(docker image inspect --format '{{json .Config.Cmd}}' mimic-web:ci)" = '["node","server.js"]'
          docker run --rm --entrypoint node mimic-web:ci --version
          test "$(docker image inspect --format '{{.Config.User}}' mimic-backup:ci)" = "mimic"
          test "$(docker image inspect --format '{{json .Config.Cmd}}' mimic-backup:ci)" = '["/opt/mimic/backup.sh"]'
          docker run --rm --entrypoint /bin/sh mimic-backup:ci -c '
            set -eu
            test "$MIMIC_POSTGRES_CLIENT_MAJOR" = "18"
            pg_dump --version | grep -Eq "^pg_dump \(PostgreSQL\) 18\."
            pg_restore --version | grep -Eq "^pg_restore \(PostgreSQL\) 18\."
            age --version
            command -v minisign
            aws --version
          '
      - name: Bootstrap API and Web health endpoints
        run: |
          set -eu
          api_id=""
          web_id=""
          cleanup() {
            if [ -n "$api_id" ]; then docker rm --force "$api_id" >/dev/null 2>&1 || true; fi
            if [ -n "$web_id" ]; then docker rm --force "$web_id" >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT
          api_id="$(docker run --detach --publish 127.0.0.1::3000 \
            --env DATABASE_URL=postgresql://mimic:ci@127.0.0.1:5432/mimic \
            --env JWT_ACCESS_SECRET=mimic-ci-access-secret \
            --env JWT_REFRESH_SECRET=mimic-ci-refresh-secret \
            mimic-api:ci)"
          web_id="$(docker run --detach --publish 127.0.0.1::3000 mimic-web:ci)"
          api_port="$(docker port "$api_id" 3000/tcp | sed 's/.*://' | head -n 1)"
          web_port="$(docker port "$web_id" 3000/tcp | sed 's/.*://' | head -n 1)"
          wait_for_health() {
            label="$1"
            url="$2"
            container_id="$3"
            for attempt in $(seq 1 30); do
              response="$(curl --fail --silent "$url" 2>/dev/null || true)"
              if printf '%s' "$response" | grep -q '"ok":true'; then return 0; fi
              sleep 1
            done
            printf '%s\n' "$label failed to become healthy" >&2
            docker logs "$container_id" >&2
            return 1
          }
          wait_for_health API "http://127.0.0.1:${api_port}/api/v1/health/live" "$api_id"
          wait_for_health Web "http://127.0.0.1:${web_port}/api/health/live" "$web_id"
