<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mimic Wordmark V7 pixel-line shine review</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #101329; color: #f4ecd7; }
    main { width: min(1400px, 100%); margin: auto; padding: clamp(20px, 4vw, 56px); }
    h1 { margin: 0 0 10px; font-size: clamp(28px, 4vw, 44px); }
    h2 { margin-top: 42px; color: #ffd45b; }
    p { max-width: 88ch; line-height: 1.6; }
    .warning { color: #ffd45b; }
    .views { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin-top: 22px; background: #3d405d; border: 1px solid #3d405d; border-radius: 14px; overflow: hidden; }
    figure { margin: 0; padding: 20px; min-width: 0; display: grid; place-items: center; gap: 12px; background: #191b31; }
    img { display: block; max-width: 100%; height: auto; image-rendering: pixelated; }
    figcaption { justify-self: start; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; opacity: .74; }
    .paper, .compare figure { background: #f3ead2; color: #2b2030; }
    .compact { grid-column: 1 / -1; min-height: 180px; background: repeating-conic-gradient(#e9dfc8 0 25%, #dfd2b7 0 50%) 0 / 20px 20px; color: #2b2030; }
    .compact img { width: 260px; max-width: 72vw; }
    .reference figure { background: #20233c; }
    @media (max-width: 720px) { .views { grid-template-columns: 1fr; } .compact { grid-column: auto; } }
  </style>
</head>
<body>
  <main>
    <h1>Wordmark V7 · 保留像素線條的金幣光澤</h1>
    <p>以 V6 的視覺構成為基準，這一輪只指定收斂金幣亮面：移除大片實心白色高光，恢復斜向刻線與金色像素分帶；亮部改為沿刻線排列的短促、斷續階梯線與少量亮點。牙齒、愛心、字形、眼睛、眉毛與木材拼湊沒有主動改造。</p>
    <p class="warning">Review-only：未取代 calibration，未加入 manifest、runtime 或產品頁。</p>

    <section class="views">
      <figure><img src="samples/wordmark-synthesis/wordmark-synthesis-v07.png" alt="MIMIC Wordmark V7，深藍背景"><figcaption>V7 · 深藍背景</figcaption></figure>
      <figure class="paper"><img src="samples/wordmark-synthesis/wordmark-synthesis-v07.png" alt="MIMIC Wordmark V7，淺色背景"><figcaption>V7 · 淺色背景</figcaption></figure>
      <figure class="compact"><img src="samples/wordmark-synthesis/wordmark-synthesis-v07.png" alt="MIMIC Wordmark V7，縮小檢視"><figcaption>V7 · 260px 縮小檢視</figcaption></figure>
    </section>

    <h2>V6／V7 直接比對</h2>
    <section class="views compare">
      <figure><img src="samples/wordmark-synthesis/wordmark-synthesis-v06b.png" alt="Wordmark V6，大塊金幣高光"><figcaption>V6 · 較大片、較實心的高光</figcaption></figure>
      <figure><img src="samples/wordmark-synthesis/wordmark-synthesis-v07.png" alt="Wordmark V7，沿刻線的像素高光"><figcaption>V7 · 斷續像素線與原刻紋</figcaption></figure>
    </section>

    <h2>原始金幣線條參考</h2>
    <section class="views reference">
      <figure><img src="samples/wordmark-synthesis/wordmark-synthesis-v04.png" alt="Wordmark V4，原始金幣像素刻線"><figcaption>V4 · 原始斜向刻線與像素分帶</figcaption></figure>
      <figure><img src="samples/wordmark-synthesis/wordmark-synthesis-v07.png" alt="Wordmark V7，保留斜向刻線並增加光澤"><figcaption>V7 · 在線條基礎上增加光澤</figcaption></figure>
    </section>
  </main>
</body>
</html>
