<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mimic Phase 2E 安裝圖示審閱</title>
<style>
  :root { color-scheme: light; background: #fffaf0; color: #211a18; font: 16px/1.5 system-ui, sans-serif; }
  body { max-width: 68rem; margin: auto; padding: 24px; }
  h1, h2, h3, p, figure { margin: 0; }
  h1 { font-size: 1.8rem; }
  h2 { font-size: 1.25rem; }
  h3 { font-size: 1rem; }
  p { margin-block: 8px 16px; }
  img { display: block; width: 100%; height: auto; }
  section { margin-block: 28px; }
  .comparison { border-top: 1px solid #d9c7a8; padding-block: 16px; }
  .trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(6px, 2vw, 20px); margin-top: 8px; }
  .preview { display: block; position: relative; }
  .preview img { image-rendering: pixelated; }
  .safe::after { content: ""; position: absolute; inset: 10%; border: 2px dashed #fff; border-radius: 50%; box-shadow: 0 0 0 1px #211a18; }
  figcaption { margin-top: 4px; }
  .wallpapers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 12px; }
  .wallpaper { border: 1px solid #8a7c6c; border-radius: 8px; padding: 14px; }
  .light { background: #e8d8b9; }
  .dark { background: #26252c; color: #fffaf0; }
  .samples { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; }
  .samples figure { display: grid; align-content: end; justify-items: center; font-size: .78rem; }
  .samples img { width: var(--size); height: var(--size); border-radius: 22%; }
  .samples .maskable { border-radius: 50%; }
</style>
<body>
  <h1>Phase 2E 安裝圖示審閱</h1>
  <p>暖深褐以 <code>#211a18</code> 為基準。遮罩的白色是換色像素，黑色是原樣保留的像素。虛線標出 maskable 圖示的安全區，半徑為圖示寬度的 40%。</p>
  <section id="home-screen" aria-labelledby="simulation">
    <h2 id="simulation">主畫面實際大小模擬</h2>
    <div class="wallpapers"></div>
  </section>
  <section aria-labelledby="compare">
    <h2 id="compare">原版、新版與變更遮罩</h2>
    <div id="comparisons"></div>
  </section>
  <script>
    const root = "../../approved/page-visual-v1/icons/";
    const names = [
      "favicon-16", "favicon-32", "icon-192", "icon-512", "icon-maskable-192", "icon-maskable-512",
    ];
    const original = (name) => root + "install/" + name + ".png";
    const warm = (name) => root + "install-warm/" + name + ".png";
    const mask = (name) => "screenshots/masks/" + name + ".png";
    document.querySelector("#comparisons").innerHTML = names.map((name) => {
      const safe = name.includes("maskable") ? " safe" : "";
      const panels = [
        [original(name), "原版", safe],
        [warm(name), "新版", safe],
        [mask(name), "變更遮罩", ""],
      ];
      return `<article class="comparison"><h3>${name}.png</h3><div class="trio">${panels.map(([src, label, overlay]) =>
        `<figure><span class="preview${overlay}"><img src="${src}" alt="${name} ${label}"></span><figcaption>${label}</figcaption></figure>`
      ).join("")}</div></article>`;
    }).join("");
    document.querySelector(".wallpapers").innerHTML = [["light", "淺色桌布"], ["dark", "深色桌布"]].map(([tone, title]) =>
      `<article class="wallpaper ${tone}"><h3>${title}</h3><div class="samples">${[60, 40].flatMap((size) =>
        [["icon-192", "一般", ""], ["icon-maskable-192", "裁切", "maskable"]].map(([name, label, shape]) =>
          `<figure style="--size:${size}px"><img class="${shape}" src="${warm(name)}" alt="${label} ${size} px"><figcaption>${label} ${size}px</figcaption></figure>`
        )).join("")}</div></article>`
    ).join("");
  </script>
</body>
</html>
